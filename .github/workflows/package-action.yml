name: Build ppbt python package

on:
  workflow_call:
    inputs:
      kind:
        required: false
        type: string
        default: dev
      cmd:
        required: false
        type: string
        description: Command used to build python package
        default: >-
          python -m
          build
          -C--global-option=egg_info
          -C--global-option=--tag-build=dev$(git rev-parse --short HEAD)
          --wheel
          --outdir dist/
    outputs:
      version:
        value: "${{ jobs.build.outputs.version }}"

jobs:
  build-source:
    name: Build Source Tarballs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ppbt
            pkg_dir: "."
          - pkg: ppbt-cross-aarch64-linux-gnu
            pkg_dir: packages/cross-aarch64-linux-gnu
          - pkg: ppbt-cross-x86_64-linux-gnu
            pkg_dir: packages/cross-x86_64-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build Source Tarball
        working-directory: ${{ matrix.pkg_dir }}
        run: |
          python3 -m build -s

      - name: Python Build Artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Source Tarball ${{ matrix.pkg }}
          path: ${{ matrix.pkg_dir }}/dist/*
          retention-days: 5

  build:
    name: Build Python Wheel
    strategy:
      fail-fast: false
      matrix:
        # Each cell = one wheel.  The base ``ppbt`` wheel builds on both
        # arches (native toolchain).  Cross wheels build on their *host*
        # arch only (an aarch64-linux-gnu cross toolchain runs on x86_64).
        include:
          - host: x86_64
            runs_on: ubuntu-latest
            pkg: ppbt
            pkg_dir: "."
          - host: aarch64
            runs_on: ubuntu-24.04-arm
            pkg: ppbt
            pkg_dir: "."
          - host: x86_64
            runs_on: ubuntu-latest
            pkg: ppbt-cross-aarch64-linux-gnu
            pkg_dir: packages/cross-aarch64-linux-gnu
          - host: aarch64
            runs_on: ubuntu-24.04-arm
            pkg: ppbt-cross-x86_64-linux-gnu
            pkg_dir: packages/cross-x86_64-linux-gnu
    runs-on: ${{ matrix.runs_on }}
    container:
      image: debian:12
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Update Apt
      run: >-
        apt-get update

    - name: Install OS Dependencies
      run: >-
        apt-get install -y gcc python3
        python3-pip python3-venv flex make
        texinfo unzip help2man gawk libtool-bin libncurses5-dev
        bison wget rsync git

    - name: Create virtualenv
      run: >-
        python3 -m venv venv

    - name: Activate virtualenv
      run: |
        . venv/bin/activate
        echo PATH=$PATH >> $GITHUB_ENV

    - name: Python Version
      run: >-
        python3 --version

    - name: Install Python Dependencies
      run: >-
        pip install build wheel setuptools pkginfo

    - name: Build Wheel
      working-directory: ${{ matrix.pkg_dir }}
      run: |
        ${{ inputs.cmd }}

    - name: Python Build Artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      if: always()
      with:
        name: Python Wheel ${{ matrix.pkg }} ${{ matrix.host }}
        path: ${{ matrix.pkg_dir }}/dist/*.whl
        retention-days: 5

    - name: Read Version
      working-directory: ${{ matrix.pkg_dir }}
      run: >-
        python3
        -c
        "from pkginfo import Wheel; s = Wheel('''$(ls dist/*.whl)'''); print('version='+str(s.version))"
        >>
        $GITHUB_OUTPUT
      id: version
