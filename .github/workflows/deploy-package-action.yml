name: ppbt Python Package

on: workflow_call

jobs:
  release:
    name: Publish Python Wheels
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download Source Tarballs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: Source Tarball *
          path: dist
          merge-multiple: true

      - name: Download Python Wheels
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: Python Wheel *
          path: dist
          merge-multiple: true

      - name: List dist directory
        run: ls -la dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          verbose: true
          print-hash: true
          skip-existing: true
          verify-metadata: true
          # Reusable-workflow footgun: the sigstore attestation cert
          # names the entry-point workflow (release.yml), but the
          # trusted-publisher configs on PyPI name this file.  Disable
          # PEP 740 attestations until the publisher configs are
          # repointed at release.yml.
          attestations: false
