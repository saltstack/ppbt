name: CI

on:
  workflow_call:
    inputs:
      kind:
        required: false
        type: string
        default: dev
      package_command:
        required: false
        type: string
        description: Command used to build python package
        default: >-
          python -m
          build
          -C--global-option=egg_info
          -C--global-option=--tag-build=+dev$(git rev-parse --short HEAD)
          --wheel
          --outdir dist/

jobs:

  get-changed-files:
    name: Get Changed Files
    runs-on: ubuntu-latest
    permissions:
      contents: read  # for dorny/paths-filter to fetch a list of changed files
      pull-requests: read  # for dorny/paths-filter to read pull requests
    outputs:
      changed-files: ${{ toJSON(steps.changed-files.outputs) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Get Changed Files
        id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          token: ${{ github.token }}
          list-files: json
          filters: |
            repo:
              - added|modified:
                - '**'
            deleted:
              - deleted:
                - '**'

  pre-commit:
    name: Pre-Commit
    uses: ./.github/workflows/pre-commit-action.yml
    needs:
      - get-changed-files
    with:
      changed-files: ${{ needs.get-changed-files.outputs.changed-files }}

  test:
    name: Test
    needs:
      - get-changed-files
    uses: ./.github/workflows/test-action.yml
    with:
      changed-files: ${{ needs.get-changed-files.outputs.changed-files }}

  build-python-package:
    name: Python Package
    uses: ./.github/workflows/package-action.yml
    needs:
      - pre-commit
      - test
    with:
      kind: "${{ inputs.kind }}"
      cmd: "${{ inputs.package_command }}"

  test-python-package:
    name: Test Python Package
    needs:
      - get-changed-files
    uses: ./.github/workflows/test-package-action.yml
    with:
      changed-files: ${{ needs.get-changed-files.outputs.changed-files }}

  deploy-python-package:
    name: Deploy Python Package
    uses: ./.github/workflows/deploy-package-action.yml
    if: ${{ inputs.kind == 'release' && success() }}
    needs:
      - pre-commit
      - test
      - test-python-package
      - build-python-package

  create-release:
    name: Create Github Release
    uses: ./.github/workflows/github-release.yml
    if: ${{ inputs.kind == 'release' && success() }}
    needs:
      - build-python-package
      - deploy-python-package
    with:
      version: ${{ needs.build-python-package.outputs.version }}

  set-pipeline-exit-status:
    # This step is just so we can make github require this step, to pass checks
    # on a pull request instead of requiring all
    name: Set the CI Pipeline Exit Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - pre-commit
      - test
      - deploy-python-package
      - create-release
    steps:
      - name: Set Pipeline Exit Status
        shell: bash
        # Roll up the results of the needed jobs into a single pass/fail
        # for the branch-protection required check.  Replaces
        # technote-space/workflow-conclusion-action, which was abandoned
        # on node16 and only emitted this same rollup.  `skipped` is
        # benign here -- deploy-python-package and create-release
        # intentionally skip on non-release runs.
        run: |
          fail=0
          for result in \
              "${{ needs.pre-commit.result }}" \
              "${{ needs.test.result }}" \
              "${{ needs.deploy-python-package.result }}" \
              "${{ needs.create-release.result }}" \
          ; do
            case "$result" in
              success|skipped) ;;
              *) echo "non-success job result: $result" >&2; fail=1 ;;
            esac
          done
          exit "$fail"

      - name: Done
        if: always()
        run: echo "All workflows finished"
