name: Create Github Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  release:
    name: Create Github Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Source Tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: Source Tarball *
          path: dist
          merge-multiple: true

      - name: Download Python Wheels
        uses: actions/download-artifact@v4
        with:
          pattern: Python Wheel *
          path: dist
          merge-multiple: true

      - name: List dist directory
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Release v${{ inputs.version }}"
          body: "Release ${{ inputs.version }}"
          draft: false
          prerelease: false
          files: |
            dist/*
