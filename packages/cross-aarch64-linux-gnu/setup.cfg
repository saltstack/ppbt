[metadata]
name = ppbt-cross-aarch64-linux-gnu
version = attr: ppbt_cross_aarch64_linux_gnu.__version__
author = Daniel A. Wozniak
author_email = <daniel.wozniak@broadcom.com>
long-description-content-type = text/markdown
long_description = file: README.md
description = Portable Python Build Toolchain - aarch64-linux-gnu cross toolchain
license = Apache License 2.0
license_file = LICENSE.md
url = https://github.com/saltstack/ppbt
bug_tracker = https://github.com/saltstack/ppbt/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Development Status :: 2 - Pre-Alpha
    Operating System :: POSIX :: Linux

[options]
package_dir=
    =src
packages = find:
python_requires = >=3
include_package_data = True

[options.packages.find]
where=src

[options.package_data]
*=_config/**, _toolchain/**

[options.entry_points]
ppbt.toolchains =
    aarch64-linux-gnu = ppbt_cross_aarch64_linux_gnu
